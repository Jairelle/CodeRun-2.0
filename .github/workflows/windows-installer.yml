# Builds the Windows installer (CodeRun-x.y.z.exe) on GitHub's Windows machines.
# Start it from the repo's Actions tab ("Run workflow"), or push a tag like v2.0.0 to also attach it to a Release.
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   CODERUN_DB_HOST, CODERUN_DB_PORT, CODERUN_DB_NAME, CODERUN_DB_USER, CODERUN_DB_PASSWORD   (the LIMITED player login)
#   CODERUN_MAIL_USER, CODERUN_MAIL_PASSWORD                                                  (sign-up email sender)
name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: WiX Toolset 3
        shell: pwsh
        run: |
          if (-not (Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version 3.14.1 -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        env:
          CODERUN_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '2.0.0' }}
          CODERUN_DB_HOST: ${{ secrets.CODERUN_DB_HOST }}
          CODERUN_DB_PORT: ${{ secrets.CODERUN_DB_PORT }}
          CODERUN_DB_NAME: ${{ secrets.CODERUN_DB_NAME }}
          CODERUN_DB_USER: ${{ secrets.CODERUN_DB_USER }}
          CODERUN_DB_PASSWORD: ${{ secrets.CODERUN_DB_PASSWORD }}
          CODERUN_MAIL_USER: ${{ secrets.CODERUN_MAIL_USER }}
          CODERUN_MAIL_PASSWORD: ${{ secrets.CODERUN_MAIL_PASSWORD }}
        run: |
          $env:CODERUN_VERSION = $env:CODERUN_VERSION.TrimStart('v')
          ./packaging/package-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: CodeRun-Windows-installer
          path: dist/*.exe
          retention-days: 3   # keeps GitHub's free 500 MB storage clear

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
